<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Voice Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .language-selector {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .language-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .language-group label {
            font-size: 1.1em;
            font-weight: 600;
        }

        select {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .swap-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5em;
        }

        .swap-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(180deg);
        }

        .translation-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .text-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .text-area h3 {
            margin-bottom: 15px;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .text-content {
            font-size: 1.1em;
            line-height: 1.6;
            min-height: 80px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 150px;
            justify-content: center;
        }

        .mic-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .mic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .mic-btn.listening {
            background: linear-gradient(45deg, #00d2d3, #54a0ff);
            animation: pulse 1.5s infinite;
        }

        .play-btn {
            background: linear-gradient(45deg, #5f27cd, #341f97);
            color: white;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(95, 39, 205, 0.4);
        }

        .clear-btn {
            background: linear-gradient(45deg, #ffa502, #ff6348);
            color: white;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 165, 2, 0.4);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 210, 211, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(0, 210, 211, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 210, 211, 0);
            }
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            opacity: 0.8;
        }

        .history {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .history h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00d2d3;
        }

        .history-item .original {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .history-item .translated {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .language-selector {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .translation-area {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .control-btn {
                width: 100%;
                max-width: 250px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Real-Time Voice Translator</h1>
        
        <div class="language-selector">
            <div class="language-group">
                <label for="source-lang">From:</label>
                <select id="source-lang">
                    <option value="auto">Auto Detect</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="nl">Dutch</option>
                    <option value="sv">Swedish</option>
                    <option value="pl">Polish</option>
                    <option value="ta">Tamil</option>
                </select>
            </div>
            
            <button class="swap-btn" id="swap-languages" title="Swap languages">⇄</button>
            
            <div class="language-group">
                <label for="target-lang">To:</label>
                <select id="target-lang">
                    <option value="en">English</option>
                    <option value="es" selected>Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="nl">Dutch</option>
                    <option value="sv">Swedish</option>
                    <option value="pl">Polish</option>
                    <option value="ta">Tamil</option>
                </select>
            </div>
        </div>

        <div class="translation-area">
            <div class="text-area">
                <h3>Original Text</h3>
                <div class="text-content" id="original-text">
                    Click the microphone to start speaking...
                </div>
            </div>
            
            <div class="text-area">
                <h3>Translation</h3>
                <div class="text-content" id="translated-text">
                    Translation will appear here...
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn mic-btn" id="mic-btn">
                <span>🎤</span>
                Start Listening
            </button>
            
            <button class="control-btn play-btn" id="play-btn">
                <span>🔊</span>
                Play Translation
            </button>
            
            <button class="control-btn clear-btn" id="clear-btn">
                <span>🗑️</span>
                Clear All
            </button>
        </div>

        <div class="status" id="status">
            Ready to translate. Click the microphone to begin.
        </div>

        <div class="history" id="history-section" style="display: none;">
            <h3>Translation History</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        class VoiceTranslator {
            constructor() {
                this.recognition = null;
                this.synthesis = window.speechSynthesis;
                this.isListening = false;
                this.translationHistory = [];
                this.translationCache = new Map();
                this.debounceTimer = null;
                this.lastTranscript = '';
                this.isTranslating = false;
                this.requestQueue = [];
                
                this.initElements();
                this.initSpeechRecognition();
                this.attachEventListeners();
                this.preloadVoices();
            }

            initElements() {
                this.elements = {
                    micBtn: document.getElementById('mic-btn'),
                    playBtn: document.getElementById('play-btn'),
                    clearBtn: document.getElementById('clear-btn'),
                    swapBtn: document.getElementById('swap-languages'),
                    sourceLang: document.getElementById('source-lang'),
                    targetLang: document.getElementById('target-lang'),
                    originalText: document.getElementById('original-text'),
                    translatedText: document.getElementById('translated-text'),
                    status: document.getElementById('status'),
                    historySection: document.getElementById('history-section'),
                    historyList: document.getElementById('history-list')
                };
            }

            initSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    
                    this.recognition.continuous = true;
                    this.recognition.interimResults = true;
                    this.recognition.maxAlternatives = 1;
                    this.recognition.lang = 'en-US';
                    
                    this.recognition.onstart = () => {
                        this.isListening = true;
                        this.updateMicButton();
                        this.updateStatus('Listening... Speak now!');
                    };
                    
                    this.recognition.onresult = (event) => {
                        let interimTranscript = '';
                        let finalTranscript = '';
                        
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                finalTranscript += transcript;
                            } else {
                                interimTranscript += transcript;
                            }
                        }
                        
                        const displayText = finalTranscript + interimTranscript;
                        this.elements.originalText.textContent = displayText;
                        
                        // Debounced translation for interim results
                        if (interimTranscript.trim() && interimTranscript.trim() !== this.lastTranscript) {
                            this.lastTranscript = interimTranscript.trim();
                            this.debouncedTranslate(interimTranscript.trim());
                        }
                        
                        // Immediate translation for final results
                        if (finalTranscript) {
                            this.translateText(finalTranscript.trim(), true);
                        }
                    };
                    
                    this.recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                        this.stopListening();
                        this.updateStatus(`Error: ${event.error}. Please try again.`);
                    };
                    
                    this.recognition.onend = () => {
                        this.stopListening();
                    };
                } else {
                    this.updateStatus('Speech recognition not supported in this browser.');
                }
            }

            attachEventListeners() {
                this.elements.micBtn.addEventListener('click', () => {
                    this.toggleListening();
                });
                
                this.elements.playBtn.addEventListener('click', () => {
                    this.playTranslation();
                });
                
                this.elements.clearBtn.addEventListener('click', () => {
                    this.clearAll();
                });
                
                this.elements.swapBtn.addEventListener('click', () => {
                    this.swapLanguages();
                });
                
                this.elements.sourceLang.addEventListener('change', () => {
                    if (this.recognition) {
                        this.recognition.lang = this.getLanguageCode(this.elements.sourceLang.value);
                    }
                });
            }

            toggleListening() {
                if (!this.recognition) {
                    this.updateStatus('Speech recognition not available.');
                    return;
                }

                if (this.isListening) {
                    this.recognition.stop();
                } else {
                    this.recognition.lang = this.getLanguageCode(this.elements.sourceLang.value);
                    this.recognition.start();
                }
            }

            stopListening() {
                this.isListening = false;
                this.updateMicButton();
                this.updateStatus('Ready to translate. Click the microphone to begin.');
            }

            updateMicButton() {
                if (this.isListening) {
                    this.elements.micBtn.classList.add('listening');
                    this.elements.micBtn.innerHTML = '<span>🔴</span>Stop Listening';
                } else {
                    this.elements.micBtn.classList.remove('listening');
                    this.elements.micBtn.innerHTML = '<span>🎤</span>Start Listening';
                }
            }

            preloadVoices() {
                // Preload voices for faster access
                if (this.synthesis.getVoices().length === 0) {
                    this.synthesis.addEventListener('voiceschanged', () => {
                        this.voices = this.synthesis.getVoices();
                    });
                } else {
                    this.voices = this.synthesis.getVoices();
                }
            }

            debouncedTranslate(text) {
                // Clear existing timer
                if (this.debounceTimer) {
                    clearTimeout(this.debounceTimer);
                }
                
                // Set new timer for interim results
                this.debounceTimer = setTimeout(() => {
                    this.translateText(text, false);
                }, 200); // 200ms debounce for interim results
            }

            async translateText(text, isFinal = true) {
                if (!text.trim() || (this.isTranslating && !isFinal)) return;
                
                const sourceLang = this.elements.sourceLang.value === 'auto' ? 'en' : this.elements.sourceLang.value;
                const targetLang = this.elements.targetLang.value;
                
                if (sourceLang === targetLang) {
                    this.elements.translatedText.textContent = text;
                    if (isFinal) this.updateStatus('Same language selected. No translation needed.');
                    return;
                }
                
                // Check cache first
                const cacheKey = `${sourceLang}-${targetLang}-${text.toLowerCase()}`;
                if (this.translationCache.has(cacheKey)) {
                    const cachedTranslation = this.translationCache.get(cacheKey);
                    this.elements.translatedText.textContent = cachedTranslation;
                    if (isFinal) {
                        this.addToHistory(text, cachedTranslation);
                        this.updateStatus('Translation complete!');
                    }
                    return;
                }
                
                this.isTranslating = true;
                if (isFinal) this.updateStatus('Translating...');
                
                try {
                    // Use Promise.race for faster response with timeout
                    const translationPromise = this.fetchTranslation(text, sourceLang, targetLang);
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Translation timeout')), 2500)
                    );
                    
                    const translation = await Promise.race([translationPromise, timeoutPromise]);
                    
                    if (translation) {
                        this.elements.translatedText.textContent = translation;
                        
                        // Cache the result
                        this.translationCache.set(cacheKey, translation);
                        
                        // Limit cache size
                        if (this.translationCache.size > 100) {
                            const firstKey = this.translationCache.keys().next().value;
                            this.translationCache.delete(firstKey);
                        }
                        
                        if (isFinal) {
                            // Add to history
                            this.addToHistory(text, translation);
                            this.updateStatus('Translation complete!');
                        }
                    }
                } catch (error) {
                    console.error('Translation error:', error);
                    if (isFinal) {
                        this.elements.translatedText.textContent = 'Translation error. Please try again.';
                        this.updateStatus('Translation failed. Please try again.');
                    }
                } finally {
                    this.isTranslating = false;
                }
            }
            
            async fetchTranslation(text, sourceLang, targetLang) {
                // Use multiple translation services for better reliability and speed
                const services = [
                    () => this.translateWithMyMemory(text, sourceLang, targetLang),
                    () => this.translateWithLibreTranslate(text, sourceLang, targetLang)
                ];
                
                // Try services in parallel for fastest response
                const promises = services.map(service => 
                    service().catch(err => {
                        console.warn('Service failed:', err);
                        return null;
                    })
                );
                
                const results = await Promise.allSettled(promises);
                
                // Return first successful result
                for (const result of results) {
                    if (result.status === 'fulfilled' && result.value) {
                        return result.value;
                    }
                }
                
                throw new Error('All translation services failed');
            }
            
            async translateWithMyMemory(text, sourceLang, targetLang) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                        },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) throw new Error('MyMemory API error');
                    
                    const data = await response.json();
                    if (data.responseData && data.responseData.translatedText) {
                        return data.responseData.translatedText;
                    }
                    
                    throw new Error('Invalid MyMemory response');
                } catch (error) {
                    clearTimeout(timeoutId);
                    throw error;
                }
            }
            
            async translateWithLibreTranslate(text, sourceLang, targetLang) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                try {
                    const response = await fetch('https://libretranslate.de/translate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            q: text,
                            source: sourceLang,
                            target: targetLang,
                            format: 'text'
                        }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) throw new Error('LibreTranslate API error');
                    
                    const data = await response.json();
                    if (data.translatedText) {
                        return data.translatedText;
                    }
                    
                    throw new Error('Invalid LibreTranslate response');
                } catch (error) {
                    clearTimeout(timeoutId);
                    throw error;
                }
            }

            playTranslation() {
                const text = this.elements.translatedText.textContent;
                if (!text || text === 'Translation will appear here...' || text.includes('Translation error')) {
                    this.updateStatus('No translation to play.');
                    return;
                }
                
                // Stop any ongoing speech
                this.synthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = this.getLanguageCode(this.elements.targetLang.value);
                utterance.rate = 0.9; // Slightly faster for better responsiveness
                utterance.pitch = 1;
                utterance.volume = 1;
                
                // Try to use native voice for the language
                const voices = this.voices || this.synthesis.getVoices();
                const targetLang = this.elements.targetLang.value;
                const nativeVoice = voices.find(voice => 
                    voice.lang.startsWith(targetLang) || 
                    voice.lang.startsWith(this.getLanguageCode(targetLang).split('-')[0])
                );
                
                if (nativeVoice) {
                    utterance.voice = nativeVoice;
                }
                
                utterance.onstart = () => {
                    this.updateStatus('Playing translation...');
                };
                
                utterance.onend = () => {
                    this.updateStatus('Ready to translate. Click the microphone to begin.');
                };
                
                utterance.onerror = () => {
                    this.updateStatus('Playback error. Text-to-speech not available for this language.');
                };
                
                this.synthesis.speak(utterance);
            }

            addToHistory(original, translation) {
                const historyItem = {
                    original,
                    translation,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                this.translationHistory.unshift(historyItem);
                
                // Keep only last 5 items
                if (this.translationHistory.length > 5) {
                    this.translationHistory = this.translationHistory.slice(0, 5);
                }
                
                this.updateHistoryDisplay();
            }

            updateHistoryDisplay() {
                if (this.translationHistory.length === 0) {
                    this.elements.historySection.style.display = 'none';
                    return;
                }
                
                this.elements.historySection.style.display = 'block';
                this.elements.historyList.innerHTML = '';
                
                this.translationHistory.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.innerHTML = `
                        <div class="original">${item.original}</div>
                        <div class="translated">${item.translation}</div>
                        <small style="opacity: 0.6;">${item.timestamp}</small>
                    `;
                    this.elements.historyList.appendChild(historyItem);
                });
            }

            clearAll() {
                this.elements.originalText.textContent = 'Click the microphone to start speaking...';
                this.elements.translatedText.textContent = 'Translation will appear here...';
                this.translationHistory = [];
                this.translationCache.clear(); // Clear cache for fresh start
                this.lastTranscript = '';
                this.updateHistoryDisplay();
                this.synthesis.cancel();
                
                if (this.debounceTimer) {
                    clearTimeout(this.debounceTimer);
                    this.debounceTimer = null;
                }
                
                if (this.isListening) {
                    this.recognition.stop();
                }
                
                this.updateStatus('All cleared. Ready to translate.');
            }

            swapLanguages() {
                const sourceLang = this.elements.sourceLang.value;
                const targetLang = this.elements.targetLang.value;
                
                if (sourceLang !== 'auto') {
                    this.elements.sourceLang.value = targetLang;
                    this.elements.targetLang.value = sourceLang;
                    
                    // Swap text content
                    const originalText = this.elements.originalText.textContent;
                    const translatedText = this.elements.translatedText.textContent;
                    
                    if (originalText !== 'Click the microphone to start speaking...' && 
                        translatedText !== 'Translation will appear here...') {
                        this.elements.originalText.textContent = translatedText;
                        this.elements.translatedText.textContent = originalText;
                    }
                    
                    this.updateStatus('Languages swapped!');
                }
            }

            getLanguageCode(lang) {
                const langMap = {
                    'en': 'en-US',
                    'es': 'es-ES',
                    'fr': 'fr-FR',
                    'de': 'de-DE',
                    'it': 'it-IT',
                    'pt': 'pt-PT',
                    'ru': 'ru-RU',
                    'ja': 'ja-JP',
                    'ko': 'ko-KR',
                    'zh': 'zh-CN',
                    'ar': 'ar-SA',
                    'hi': 'hi-IN',
                    'nl': 'nl-NL',
                    'sv': 'sv-SE',
                    'pl': 'pl-PL',
                    'ta': 'ta-IN',
                    'auto': 'en-US'
                };
                return langMap[lang] || 'en-US';
            }

            updateStatus(message) {
                this.elements.status.textContent = message;
            }
        }

        // Initialize the voice translator when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new VoiceTranslator();
        });
    </script>
</body>
</html>
